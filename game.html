<!DOCTYPE html>
<head>
    <link rel="stylesheet" href="style.css">
    <script defer src="game.js"></script>
    <title> No Sweat :] </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>

<body>

    <div id = "loading-screen">
        <div id = "starting-lore">
            <p class = "textColor">placeholder for future starting lore</p>
        </div>
    </div>

    <div class = "choicecontainer">
        <div id = "prompt">
            <p class="textColor">Insert text here.</p>
        </div>

        <div id = "choice-buttons" class = "buttonlayout">
            <button class = "btn">Choice 1</button>
            <button class = "btn">Choice 2</button>
            <button class = "btn">Choice 3</button>
        </div>
    </div>

    <div class = "sidebarcontainer">
        <div id = "inventory">
            <h3>Backpack:</h3>
            <p class = "textColor" id = "bp-content">placeholder for inventory</p>
        </div>

        <div id = "status">
            <h3>Status:</h3>
            <p class = "textColor" id = "status-content">placeholder for status</p>
        </div>
    </div>

    <div class = "graphicscontainer">
        <img id = "game-bg" src = "assets/backgrounds/game-bg.png">
    </div>

</body>
